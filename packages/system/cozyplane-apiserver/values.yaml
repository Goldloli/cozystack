cozyplane-apiserver:
  # The cozyplane release's image by tag and digest, for mirroring and
  # promotion; the vendored chart pins a digest only.
  image: ghcr.io/lllamnyp/cozyplane:v0.1.3@sha256:4b2000091b9e1a0c734018ab3c3b85e0b7e01d4cb78ef43110b1c20a48e300aa
  # The aggregated apiserver backs every tenant's SDN API.
  replicas: 2
  etcd:
    operator:
      # local, not the chart's replicated default: a 3-member etcd already
      # replicates at the application level, and the local class exists
      # before any replication pool is configured. The EtcdCluster's
      # storageClassName is immutable after creation, so this has to be
      # right on the first install.
      storageClass: local
